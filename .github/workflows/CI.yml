name: CI
on: 
  - push
  - pull_request
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Setup checkout
        uses: actions/checkout@v5
        with: 
          submodules: recursive
      - name: Install clang-format-19
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19
          clang-format-19 --version
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build project
        run: | 
          cmake -B build \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_TOOLCHAIN_FILE=cmake/cortex-m4.cmake
          cmake --build build
      - name: Run clang-tidy
        run: | 
          FILES=$(find kernel -type f \( -name '*.c' -o -name '*.h' \) \
            ! -path '*/third_party/*')
          run-clang-tidy -p=build -quiet $FILES
      - name: Run clang-format
        run: |
          find . -not -path "./third_party/*" \
            -not -path "./build/*" \
            \( -iname '*.c' -o -iname '*.h' \) \
            | xargs clang-format --dry-run --Werror

  
