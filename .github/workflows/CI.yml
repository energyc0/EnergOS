name: CI
on: 
  - push
  - pull_request
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Setup checkout
        uses: actions/checkout@v5
      - name: Build project
        run: | 
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build
      - name: Run clang-tidy
        run: | 
          run-clang-tidy -p=build -exclude='.*/third_party/.*'
      - name: Run clang-format
        run: |
          find . -not -path "./third_party/*" \
            -not -path "./build/*" \
            \( -iname '*.c' -o -iname '*.h' \) \
            | xargs clang-format --dry-run --Werror

  